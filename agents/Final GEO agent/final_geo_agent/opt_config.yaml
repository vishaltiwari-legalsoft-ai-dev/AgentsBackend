# Content Optimizer — single source of truth for every weight/threshold.
# Layer 8 (feedback loop) retunes by emitting a new version of THIS file;
# code must never carry a magic number that belongs here.
version: 1

terms:
  prevalence_exponent: 2.0        # k in importance = tfidf x prevalence^k (allowed 1.5-3)
  rank_weight_offset: 1.5         # w(r) = 1 / log2(r + offset), normalized
  universal_idf_floor: 1.0        # idf floored at log((N+this)/N) so terms used by EVERY winner never zero out
  ngram_max: 3
  nested_ngram_overlap: 0.8       # suppress sub-gram when a super-gram covers >= this share of its count
  count_range_percentiles: [25, 75]
  high_dispersion_cqd: 0.5        # quartile coefficient of dispersion above which -> low confidence
  short_doc_words: 200            # corpus docs shorter than this -> low-confidence ranges
  range_widen_factor: 1.5         # multiply band half-width when confidence is low

structure:
  percentiles: [25, 75]
  rank_weighted: false
  small_n: 6                      # below this: widen band + low confidence
  small_n_widen_factor: 1.5
  bimodal_min_separation: 2.5     # robust gap-split separation to call a feature bimodal
  bimodal_min_fraction: 0.25      # each mode must hold at least this share of docs
  features:                       # whitelist — nothing outside this list may be profiled
    - word_count
    - h2_count
    - h3_count
    - paragraph_count
    - avg_sentence_len
    - image_count
    - list_count
    - table_count
    - internal_links
    - external_links
    - question_headings
    - numeric_density

score:
  weights: { term: 0.5, semantic: 0.3, structure: 0.2 }
  band_decay_factor: 1.5          # zero credit at decay_factor x band-width outside the band
  semantic_floor_credit: 0.6      # credit for a missing term whose subtopic is covered
  coverage_complete: 0.9          # share of subtopics covered to count coverage as "complete"
  shortness_floor: 0.5            # min word-count band score when coverage is complete (never punish concise+complete)
  stuffing_p90_multiplier: 2.0    # per-term density above corpus P90 x this -> stuffing
  stuffing_penalty_points: 10     # points subtracted from the total per detection run

serp:
  top_n: 20                       # organic results requested (10-50)
  fetch_concurrency: 6            # simultaneous page fetches
  per_domain_delay_s: 1.0         # politeness gap between hits on one domain
  fetch_timeout_s: 20
  fetch_retries: 2                # exponential backoff + jitter on top
  article_share_min: 0.4          # below this share of usable articles -> "query may not want an article"
  volatility_overlap_low: 0.5     # URL overlap vs previous snapshot below this -> volatile SERP label
  forum_domains: [reddit.com, quora.com, stackexchange.com, stackoverflow.com]
  video_domains: [youtube.com, youtu.be, vimeo.com, tiktok.com]
  product_domains: [amazon., ebay., etsy., flipkart., walmart.]
  product_path_tokens: ["/product", "/shop", "/store", "/buy", "/collections", "/dp/"]

extract:
  link_density_max: 0.5           # DOM block is boilerplate above this link-chars share
  min_block_chars: 25             # blocks shorter than this are boilerplate unless inside content
  thin_doc_words: 150             # below -> paywall/teaser suspect, doc excluded
  max_doc_words: 8000             # cap any single document's contribution (comment-swamp guard)
  interstitial_max_share: 0.35    # share of sentences matching interstitial phrases -> drop doc
  min_content_image_px: 200       # imgs smaller than this without alt = decorative, not counted
  shingle_size: 5                 # words per shingle for near-duplicate detection
  duplicate_jaccard: 0.7          # above -> syndicated copy, keep the higher-ranked one
  comment_class_tokens: [comment, disqus, respond, discussion]
  interstitial_phrases:
    - we value your privacy
    - accept all cookies
    - cookie settings
    - subscribe to our newsletter
    - enable javascript
    - please sign in

semantic:
  similarity_threshold: 0.62      # draft chunk vs subtopic centroid: covered at/above this
  embed_model: text-embedding-3-small      # OpenAI (when openai_api_key present)
  gemini_embed_model: gemini-embedding-001 # Gemini free-tier fallback (gemini_api_key); live-verified 2026-08-11
  chunk_max_sentences: 4          # sentence-window chunking when a section runs long
  chunk_overlap_sentences: 1
  cluster_merge_threshold: 0.70   # chunk joins a subtopic cluster at/above this sim
  model_thresholds:               # per-model calibration — cosine scales differ by embedder
    gemini-embedding-001:         # measured 2026-08-11: same-topic 0.76-0.85, cross 0.60-0.72
      similarity_threshold: 0.73
      cluster_merge_threshold: 0.75
  min_cluster_docs: 3             # a subtopic must appear in >= this many distinct winners
  hubness_max_matches: 3          # draft chunk matching more centroids than this is generic -> no evidence
  reciprocal_top_k: 2             # centroid must be in the matching chunk's top-K nearest centroids

# Per-vertical overrides, deep-merged over the base (e.g. health: {score: {weights: {...}}}).
verticals: {}
