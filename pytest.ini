[pytest]
# Markers are applied automatically by path — see pytest_collection_modifyitems
# in the repo-root conftest.py. Nothing needs tagging by hand; these entries
# just register the names so `-m` works and pytest raises no unknown-marker
# warnings.
#
#   pytest -m seo            # only the agent you are working on
#   pytest -m "not gd"       # everything except the slowest suite
#   pytest                   # the whole thing, as before
markers =
    gd: Graphics Designer agent (a1) — the largest and slowest suite
    mr: Marketing Research agent (a6)
    seo: SEO GEO agent (a2)
    geo: Final GEO agent (a10)
    blog: Blog Writer agent (a9)
    core: app/ and repo-level tests that belong to no single agent
